<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1000" height="760" fill="#fafafa"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AEGIS Credit Memo Ontology</text>
  <text x="500" y="64" text-anchor="middle" font-size="13" fill="#64748b">Borrower → Documents → Atomic Data → Reasoning → Memo</text>

  <!-- Layer 1: Core entity hierarchy -->
  <rect x="430" y="100" width="140" height="56" rx="10" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
  <text x="500" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Borrower</text>
  <text x="500" y="146" text-anchor="middle" font-size="11" fill="#94a3b8">SME applicant</text>

  <rect x="430" y="186" width="140" height="56" rx="10" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  <text x="500" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Entity</text>
  <text x="500" y="232" text-anchor="middle" font-size="11" fill="#cbd5e1">legal entity (LLC, S-Corp, ...)</text>

  <rect x="430" y="272" width="140" height="56" rx="10" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">FinancialPeriod</text>
  <text x="500" y="318" text-anchor="middle" font-size="11" fill="#cbd5e1">year / quarter</text>

  <line x1="500" y1="156" x2="500" y2="186" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="500" y1="242" x2="500" y2="272" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Layer 2: Documents -->
  <rect x="190" y="370" width="180" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="280" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">TaxReturn</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#3b82f6">1120 / 1120S / 1065</text>

  <rect x="630" y="370" width="180" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="720" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">BankStatement</text>
  <text x="720" y="416" text-anchor="middle" font-size="11" fill="#3b82f6">6+ months</text>

  <path d="M 460 320 Q 380 345 320 370" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 540 320 Q 620 345 680 370" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Layer 3: LineItem (atomic) -->
  <rect x="380" y="476" width="240" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">LineItem</text>
  <text x="500" y="522" text-anchor="middle" font-size="11" fill="#b45309">revenue, expense, asset, transaction</text>

  <path d="M 320 434 Q 380 455 440 476" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 680 434 Q 620 455 560 476" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Layer 4: Reasoning -->
  <rect x="120" y="580" width="200" height="64" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="220" y="606" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Ratio</text>
  <text x="220" y="626" text-anchor="middle" font-size="11" fill="#047857">DSCR · current · debt service</text>

  <rect x="680" y="580" width="200" height="64" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="780" y="606" text-anchor="middle" font-size="15" font-weight="700" fill="#9d174d">Reconciliation</text>
  <text x="780" y="626" text-anchor="middle" font-size="11" fill="#be185d">tax vs bank · draws · debt</text>

  <path d="M 400 540 Q 320 560 250 580" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 540 Q 680 560 750 580" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ExceptionFlag (downstream of Reconciliation) -->
  <rect x="680" y="676" width="200" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="780" y="703" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">ExceptionFlag</text>
  <text x="780" y="719" text-anchor="middle" font-size="10" fill="#b91c1c">discrepancy surfaced to analyst</text>

  <line x1="780" y1="644" x2="780" y2="676" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <!-- Memo -->
  <rect x="340" y="676" width="280" height="50" rx="10" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
  <text x="480" y="703" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Memo</text>
  <text x="480" y="719" text-anchor="middle" font-size="10" fill="#94a3b8">narrative grounded in every node above · cites sources</text>

  <path d="M 250 644 Q 320 660 380 676" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 680 700 L 620 700" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 500 540 Q 500 600 500 676" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="100" width="130" height="200" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="105" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">LEGEND</text>
  <rect x="54" y="138" width="14" height="14" rx="3" fill="#0f172a"/>
  <text x="76" y="150" font-size="11" fill="#475569">Core entity</text>
  <rect x="54" y="162" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="76" y="174" font-size="11" fill="#475569">Document</text>
  <rect x="54" y="186" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="76" y="198" font-size="11" fill="#475569">Atomic data</text>
  <rect x="54" y="210" width="14" height="14" rx="3" fill="#d1fae5" stroke="#10b981"/>
  <text x="76" y="222" font-size="11" fill="#475569">Computed</text>
  <rect x="54" y="234" width="14" height="14" rx="3" fill="#fce7f3" stroke="#db2777"/>
  <text x="76" y="246" font-size="11" fill="#475569">Check</text>
  <rect x="54" y="258" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="76" y="270" font-size="11" fill="#475569">Exception</text>
  <rect x="54" y="282" width="14" height="14" rx="3" fill="#0f172a"/>
  <text x="76" y="294" font-size="11" fill="#475569">Output</text>
</svg>
