<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow2-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1100" height="720" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AEGIS Architecture</text>
  <text x="550" y="64" text-anchor="middle" font-size="13" fill="#64748b">Extraction (one-time) → Reasoning (on update) → Synthesis → Measurement</text>

  <!-- Lane labels -->
  <text x="60" y="115" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">INGESTION</text>
  <text x="60" y="265" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">CORE</text>
  <text x="60" y="425" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">REASONING</text>
  <text x="60" y="575" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">DELIVERY</text>

  <!-- Analyst (top left) -->
  <circle cx="170" cy="155" r="32" fill="#1e293b" stroke="#000" stroke-width="1.5"/>
  <text x="170" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Analyst</text>
  <text x="170" y="200" text-anchor="middle" font-size="10" fill="#64748b">uploads PDFs</text>

  <!-- Upload Service -->
  <rect x="290" y="125" width="170" height="60" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="375" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Upload Service</text>
  <text x="375" y="168" text-anchor="middle" font-size="10" fill="#64748b">queue + storage</text>

  <!-- Extraction Service -->
  <rect x="510" y="125" width="220" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Extraction Service</text>
  <text x="620" y="168" text-anchor="middle" font-size="10" fill="#3b82f6">Claude (vision) + OCR fallback</text>

  <!-- Confidence Scorer -->
  <rect x="780" y="125" width="180" height="60" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="870" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Confidence Scorer</text>
  <text x="870" y="168" text-anchor="middle" font-size="10" fill="#64748b">per-field reliability</text>

  <!-- Ingestion arrows -->
  <line x1="202" y1="155" x2="290" y2="155" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="460" y1="155" x2="510" y2="155" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="730" y1="155" x2="780" y2="155" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <!-- Ontology DB (the hub) -->
  <rect x="370" y="265" width="360" height="100" rx="14" fill="#0f172a" stroke="#000" stroke-width="2"/>
  <text x="550" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Ontology DB (Postgres)</text>
  <text x="550" y="320" text-anchor="middle" font-size="11" fill="#cbd5e1">Borrower · Entity · FinancialPeriod · Document</text>
  <text x="550" y="338" text-anchor="middle" font-size="11" fill="#cbd5e1">LineItem · Ratio · Reconciliation · Memo</text>
  <text x="550" y="356" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">single source of truth</text>

  <!-- arrow into ontology from extraction -->
  <line x1="870" y1="185" x2="700" y2="265" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="800" y="225" font-size="10" fill="#64748b" font-style="italic">structured data</text>

  <!-- Reasoning layer: Reconciliation + Ratio + Memo Gen -->
  <rect x="110" y="445" width="200" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="210" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">Reconciliation Engine</text>
  <text x="210" y="490" text-anchor="middle" font-size="10" fill="#be185d">cross-doc checks →</text>
  <text x="210" y="504" text-anchor="middle" font-size="10" fill="#be185d">ExceptionFlags</text>

  <rect x="370" y="445" width="200" height="70" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="470" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Ratio Engine</text>
  <text x="470" y="490" text-anchor="middle" font-size="10" fill="#047857">DSCR, current, working cap</text>
  <text x="470" y="504" text-anchor="middle" font-size="10" fill="#047857">vs. lender thresholds</text>

  <rect x="630" y="445" width="200" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Memo Generator</text>
  <text x="730" y="490" text-anchor="middle" font-size="10" fill="#6d28d9">LLM narrative,</text>
  <text x="730" y="504" text-anchor="middle" font-size="10" fill="#6d28d9">cited to LineItems</text>

  <!-- Eval Framework (parallel reader, on the right) -->
  <rect x="880" y="445" width="180" height="70" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="970" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Eval Framework</text>
  <text x="970" y="490" text-anchor="middle" font-size="10" fill="#475569">precision · recall ·</text>
  <text x="970" y="504" text-anchor="middle" font-size="10" fill="#475569">end-to-end quality</text>

  <!-- Arrows from Ontology to reasoning engines (bidirectional) -->
  <path d="M 410 365 Q 300 400 230 445" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 250 445 Q 320 400 410 365" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow2-dim)" stroke-dasharray="3 3"/>

  <line x1="470" y1="365" x2="470" y2="445" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="490" y1="445" x2="490" y2="365" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2-dim)" stroke-dasharray="3 3"/>

  <path d="M 690 365 Q 750 400 730 445" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>

  <!-- Eval reads from ontology (parallel, dashed) -->
  <path d="M 730 315 Q 900 340 970 445" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow2-dim)" stroke-dasharray="4 3"/>
  <text x="850" y="395" font-size="9" fill="#64748b" font-style="italic">parallel read</text>

  <!-- Delivery: Analyst UI -->
  <rect x="370" y="600" width="360" height="70" rx="10" fill="#1e293b" stroke="#000" stroke-width="2"/>
  <text x="550" y="628" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Analyst UI</text>
  <text x="550" y="648" text-anchor="middle" font-size="10" fill="#cbd5e1">pre-populated memo · flagged exceptions · source citations</text>
  <text x="550" y="662" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">edit · approve · send to committee</text>

  <line x1="470" y1="515" x2="470" y2="600" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <path d="M 280 515 Q 380 555 460 600" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 700 515 Q 620 555 540 600" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>

  <!-- Back to analyst (loop) -->
  <path d="M 370 635 Q 250 635 200 200" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arrow2-dim)" stroke-dasharray="4 3"/>
  <text x="155" y="430" font-size="10" fill="#94a3b8" font-style="italic" transform="rotate(-90 155 430)">human-in-loop</text>
</svg>
